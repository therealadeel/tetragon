# Example configuration for Tetragon Control Plane Client

# Management API configuration
management_api:
  base_url: "https://api.example.com/v1"
  auth_token: ""  # Or set via TETRAGON_CONTROL_PLANE_AUTH_TOKEN env var (recommended for security)
  timeout: "30s"
  retry:
    max_attempts: 5
    initial_backoff: "1s"
    max_backoff: "60s"
    backoff_multiplier: 2.0
    retryable_http_codes: [408, 429, 500, 502, 503, 504]
  http_client:
    insecure_skip_tls_verify: false  # INSECURE: Skip TLS certificate verification (for testing/development only)

# Tetragon gRPC configuration
tetragon:
  server_address: "localhost:54321"
  timeout: "30s"

# Client registration settings
registration:
  environment: "dev" # environment configured in Splunk Control Plane app
  deployment_type: "standalone"  # standalone or kubernetes
  tags:
    - "region:us-west-2"
    - "team:security"
    - "datacenter:dc1"
    - "dev"
  use_imds: true  # Try to get instance_id from IMDSv2
  imds_timeout: "5s"

# Policy synchronization settings
policy_sync:
  enabled: true
  interval: "60s"  # How often to check for policy updates
  cleanup_existing: true  # Remove existing policies on startup
  incremental: true  # Use incremental updates (only add/update/delete changed policies)

# Health reporting settings
health_reporting:
  enabled: true
  interval: "90s"  # How often to report health

# Metrics publishing settings
metrics_publishing:
  enabled: true
  interval: "300s"  # How often to collect metrics
  endpoint: "http://localhost:2112/metrics"
  request_timeout: "30s"
  format: "prometheus"  # Raw payload format reported to the control plane
  insecure_skip_tls_verify: true  # Allow scraping HTTPS endpoints with self-signed certificates

# Logging
logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, text
  output_directory: "/var/log/tetragon"  # Directory for log files (logs to stdout if empty)
