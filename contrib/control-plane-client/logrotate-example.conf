# Logrotate configuration for Tetragon Control Plane Client
# Place this file in /etc/logrotate.d/tetragon-control-plane

/var/log/tetragon/tetragon-control-plane.log /var/log/tetragon/tetragon-control-plane.json {
    # Rotate daily
    daily
    
    # Keep 14 days of logs
    rotate 14
    
    # Compress rotated logs (not the current one)
    compress
    delaycompress
    
    # Don't error if log file is missing
    missingok
    
    # Don't rotate if log file is empty
    notifempty
    
    # Create new log file with these permissions after rotation
    create 0644 root root
    
    # Send SIGHUP to control-plane-client process to reopen log files
    postrotate
        # Find the PID of the control-plane-client process
        # Adjust the process name if needed
        pkill -HUP -f "control-plane-client" || true
    endscript
}
